name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node is >=18: the runtime is tested on every line still in use.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Generated types match openapi/public.yaml
        run: |
          npm run gen:api
          git diff --exit-code -- src/generated || {
            echo "::error::src/generated/public.ts is stale: run 'npm run gen:api' and commit the result."
            exit 1
          }

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Package exports and types (publint, arethetypeswrong)
        # attw needs Node 20+; one run is enough, the package does not depend on the Node version.
        if: matrix.node == 24
        run: npm run check:package
