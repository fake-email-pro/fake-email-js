name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    # The npm trusted publisher is bound to this environment.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance and Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # `npm stage publish` needs npm 11.15+, newer than the npm bundled with Node 24.
      - run: npm install -g npm@11

      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:package

      # Staged, not published: the trusted publisher (repo fake-email-pro/fake-email-js, workflow release.yml,
      # environment npm) allows `npm stage publish` only, and a maintainer approves the version with 2FA on
      # npmjs.com (package → Staged Packages) or with `npm stage approve <stage-id>`.
      - name: Stage on npm
        run: npm stage publish --provenance --access public

      - name: Say where to approve
        run: |
          version="$(node -p "require('./package.json').version")"
          {
            echo "### fake-email-pro@${version} is staged on npm"
            echo
            echo "Approve it with 2FA at https://www.npmjs.com/package/fake-email-pro (Staged Packages),"
            echo "or run \`npm stage list fake-email-pro\` and \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - name: Create a GitHub Release from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}"
          --generate-notes --verify-tag
